# corpus/sources.yaml
#
# The source registry for the PMM OS corpus. Every fact in corpus/*.md traces
# back to a source listed here. The corpus-refresh skill reads this file to
# decide what to refetch, when, and which corpus file each source feeds.
#
# Fields per source:
#   url          - the public URL (public sources only)
#   tier         - primary   = Dynatrace's own words / official docs / official blog
#                  secondary = community, third-party, or indirect
#   cadence      - how often corpus-refresh should refetch: weekly | monthly | quarterly
#   owner_file   - the corpus/*.md file this source feeds
#   last_fetched - ISO date of the last successful fetch, or null if never / failed
#   cache        - filename under corpus/.cache/ holding the diff baseline
#   status       - ok | blocked | never-fetched   (optional; default ok)
#   notes        - optional free text

